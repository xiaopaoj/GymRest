name: iOS 26 validation and unsigned IPA
on:
  workflow_dispatch:
    inputs:
      healthkit:
        description: Enable optional read-only HealthKit capability (requires supported signing)
        type: boolean
        default: true
      media_mode:
        description: Include media in IPA or install a separate pack
        type: choice
        options: [external, bundled]
        default: external
      media_seed_policy:
        description: Preserve local media or update a newer bundled official pack
        type: choice
        options: [preserve, updateOfficial]
        default: preserve
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      MEDIA_MODE: ${{ inputs.media_mode || 'external' }}
      MEDIA_SEED_POLICY: ${{ inputs.media_seed_policy || 'preserve' }}
      GYMREST_HEALTHKIT: ${{ (github.event_name != 'workflow_dispatch' || inputs.healthkit) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Build, test, and package
        run: bash scripts/ci.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (github.event_name != 'workflow_dispatch' || inputs.healthkit) && 'GymRest-iPhone-healthkit-unsigned' || 'GymRest-iPhone-unsigned' }}
          path: build/GymRest-unsigned.ipa
          if-no-files-found: error
      - name: Upload independent media pack and source originals
        uses: actions/upload-artifact@v4
        with:
          name: GymRest-media-pack
          path: |
            build/GymRest-Official.gymrestmedia
            build/GymRest-Media-Sources.zip
          if-no-files-found: error
      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GymRest-diagnostics
          path: |
            build/build.log
            build/release-build.log
            build/*.xcresult
            build/runtimes.json
            build/devices.json
            build/HealthKit.entitlements
            build/destinations.log
            build/xcode-candidates.txt
            GymRest.xcodeproj/project.pbxproj
          if-no-files-found: warn
