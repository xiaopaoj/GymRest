name: iOS 26 validation and unsigned IPA
on:
  workflow_dispatch:
    inputs:
      healthkit:
        description: Enable optional read-only HealthKit capability (requires supported signing)
        type: boolean
        default: true
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GYMREST_HEALTHKIT: ${{ (github.event_name != 'workflow_dispatch' || inputs.healthkit) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Build, test, and package
        run: bash scripts/ci.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (github.event_name != 'workflow_dispatch' || inputs.healthkit) && 'GymRest-healthkit-unsigned' || 'GymRest-unsigned' }}
          path: build/GymRest-unsigned.ipa
          if-no-files-found: error
      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GymRest-diagnostics
          path: |
            build/build.log
            build/*.xcresult
            build/runtimes.json
            build/devices.json
            build/HealthKit.entitlements
            build/destinations.log
            build/xcode-candidates.txt
            GymRest.xcodeproj/project.pbxproj
          if-no-files-found: warn
