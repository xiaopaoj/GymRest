name: GymRest
options:
  bundleIdPrefix: dev.gymrest
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "0.9.1"
    CURRENT_PROJECT_VERSION: "10"
targets:
  GymRest:
    type: application
    platform: iOS
    sources:
      - path: GymRest
        excludes: [Resources/Artwork, Resources/ExerciseFrames]
      - path: Shared
      - path: build/MediaResources
        type: folder
        buildPhase: resources
      - path: build/Assets.xcassets
    info:
      path: build/plists/GymRest-Info.plist
      properties:
        CFBundleDisplayName: GymRest
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: zh-Hans
        GymRestMediaMode: external
        GymRestMediaSeedPolicy: preserve
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.gymrest.media
            UTTypeDescription: GymRest 动作素材包
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gymrestmedia]
        NSAlarmKitUsageDescription: 用于在动作计时或训练休息结束时发出系统提醒。
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.gymrest.training
            CFBundleURLSchemes: [gymrest]
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gymrest.personal
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) GYMREST_APP"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: GymRestWidgets
        embed: true
  GymRestWidgets:
    type: app-extension
    platform: iOS
    sources: [GymRestWidgets, Shared]
    info:
      path: build/plists/GymRestWidgets-Info.plist
      properties:
        CFBundleDisplayName: GymRest Timer
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gymrest.personal.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  GymRestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GymRestTests
      - path: build/TestMediaFrames
        type: folder
        buildPhase: resources
      - path: build/GymRest-Official.gymrestmedia
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GymRest
schemes:
  GymRest:
    build:
      targets:
        GymRest: all
    test:
      targets: [GymRestTests]
